<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Red de floración · Relevo generacional</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="presentation" aria-label="Presentación Relevo generacional">
      <canvas id="petal-canvas" aria-hidden="true"></canvas>
      <div class="photo-layer" aria-hidden="true"></div>
      <div class="wash" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>

      <header class="topbar">
        <div class="brand-mark"><span class="brand-dot"></span> FÓRUM UPB</div>
        <div class="counter"><span id="scene-number">01</span><span class="slash">/</span><span>13</span></div>
      </header>

      <section class="content" aria-live="polite">
        <p class="eyebrow" id="scene-kicker">FUTURE LEADERS FORUM · FÓRUM UPB</p>
        <h1 id="scene-title">RELEVO GENERACIONAL:<br />LA VENTAJA QUE NADIE ESTÁ APROVECHANDO</h1>
        <p class="caption" id="scene-caption">Una red de personas, experiencia e ideas que aprende a florecer junta.</p>
      </section>

      <aside class="qr-placeholders" id="qr-placeholders" aria-hidden="true">
        <div class="qr-slot"><span>QR</span><small>MEMORIAS</small></div>
        <div class="qr-slot"><span>QR</span><small>REDES</small></div>
      </aside>

      <footer class="controls">
        <button id="prev" type="button" aria-label="Escena anterior">←</button>
        <button id="next" type="button" aria-label="Siguiente escena">→</button>
        <button id="restart" type="button" aria-label="Reiniciar presentación">Reiniciar</button>
        <button id="fullscreen" type="button" aria-label="Pantalla completa">Pantalla completa</button>
        <span class="hint">Usa ← → · R · F</span>
      </footer>
    </main>
    <script src="app.js"></script>
  </body>
</html>
